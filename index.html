<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Project_Vibe_VII — EMOM Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    background: black;
    color: #ff3333;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }

  #topBar {
    position: fixed;
    top: 10px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    opacity: 0.85;
  }

  #centerBlock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 1200px;
    text-align: center;
  }

  #clock {
    font-size: 16vw;
    font-weight: bold;
    letter-spacing: 1vw;
    text-shadow:
      0 0 2px currentColor,
      0 0 4px currentColor;
  }

  #startPauseBtn {
    width: 50%;
    margin-top: 20px;
    padding: 28px 0;
    font-size: 36px;
    background: #111;
    color: currentColor;
    border: 3px solid currentColor;
    border-radius: 18px;
    cursor: pointer;
  }

  #resetBtn {
    width: 50%;
    margin-top: 10px;
    padding: 28px 0;
    font-size: 36px;
    background: #111;
    color: currentColor;
    border: 3px solid currentColor;
    border-radius: 18px;
    cursor: pointer;
  }

  #controls {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 18px;
  }

  select, button.small {
    background: #111;
    color: white;
    border: 2px solid #444;
    padding: 8px 14px;
    font-size: 16px;
    margin: 4px;
    cursor: pointer;
    border-radius: 10px;
  }

  .green { color: #00ff66; }
  .red { color: #ff3333; }
  .cyan { color: #00ffff; }
  .orange { color: #ff9900; }

  .rainbow {
    animation: rainbow 5s linear infinite;
  }

  @keyframes rainbow {
    0% { color: red; }
    20% { color: orange; }
    40% { color: yellow; }
    60% { color: green; }
    80% { color: cyan; }
    100% { color: red; }
  }

  .usa {
    animation: usa 2s infinite;
  }

  @keyframes usa {
    0% { color: red; }
    50% { color: white; }
    100% { color: blue; }
  }
</style>
</head>

<body>

<div id="topBar">
  <div id="roundStatus">READY</div>
  <div id="elapsedWrap">Total Elapsed Time: <span id="elapsedTime">00:00</span></div>
</div>

<div id="centerBlock">
  <div id="clock">00:10</div>
  <button id="startPauseBtn">START</button>
  <button id="resetBtn">RESET</button>
</div>

<div id="controls">
  EMOMs:
  <select id="emomCount">
    <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
    <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
    <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
  </select>

  Theme:
  <button class="small" onclick="setTheme('green')">Green</button>
  <button class="small" onclick="setTheme('red')">Red</button>
  <button class="small" onclick="setTheme('orange')">Orange</button>
  <button class="small" onclick="setTheme('cyan')">Cyan</button>
  <button class="small" onclick="setTheme('rainbow')">Rainbow</button>
  <button class="small" onclick="setTheme('usa')">USA</button>

  <button class="small" onclick="toggleFullscreen()">Fullscreen</button>
</div>

<script>
  let totalEmoms = 10;
  let currentRound = 0;
  let secondsLeft = 10;
  let running = false;
  let phase = "prep";
  let timer = null;

  let elapsedSeconds = 0;
  let exerciseSeconds = 0;
  let inExercise = false;

  const clock = document.getElementById("clock");
  const startPauseBtn = document.getElementById("startPauseBtn");
  const resetBtn = document.getElementById("resetBtn");

  const roundStatus = document.getElementById("roundStatus");
  const elapsedTime = document.getElementById("elapsedTime");

  const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  const buzzer = new Audio("https://actions.google.com/sounds/v1/alarms/buzzer.ogg");
  const whistle = new Audio("https://actions.google.com/sounds/v1/sports/whistle_single.ogg");
  const goBeep = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
  const finalBuzzer = new Audio("https://actions.google.com/sounds/v1/alarms/air_horn.ogg");

  startPauseBtn.onclick = () => {
    if (!running) start();
    else pause();
  };

  resetBtn.onclick = () => reset();

  function start() {
    totalEmoms = parseInt(document.getElementById("emomCount").value);
    running = true;
    startPauseBtn.textContent = "PAUSE";
    timer = setInterval(tick, 1000);
  }

  function pause() {
    running = false;
    startPauseBtn.textContent = "START";
    clearInterval(timer);
  }

  function tick() {
    secondsLeft--;

    if (inExercise) {
      exerciseSeconds++;
    }

    // only start exercise timer after prep ends
    if (phase === "emom") {
      inExercise = true;
    }

    updateElapsed();

    if (secondsLeft > 0 && secondsLeft <= 3) {
      beep.play();
    }

    if (secondsLeft < 0) {
      if (phase === "prep") {
        phase = "emom";
        currentRound = 1;
        secondsLeft = 60;
        goBeep.play();
      } else {
        roundStatus.textContent = `ROUND ${currentRound} COMPLETE`;

        if (currentRound === totalEmoms) {
          finalBuzzer.play();
          reset();
          return;
        } else {
          currentRound++;
          secondsLeft = 60;
          goBeep.play();
        }
      }
    }

    updateDisplay();
  }

  function reset() {
    clearInterval(timer);
    running = false;
    phase = "prep";
    secondsLeft = 10;
    currentRound = 0;

    elapsedSeconds = 0;
    exerciseSeconds = 0;
    inExercise = false;

    startPauseBtn.textContent = "START";
    roundStatus.textContent = "DONE";
    updateDisplay();
    updateElapsed();
  }

  function updateDisplay() {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    clock.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    if (phase === "emom") {
      roundStatus.textContent = `ROUND ${currentRound} / ${totalEmoms}`;
    }
  }

  function updateElapsed() {
    const m = Math.floor(exerciseSeconds / 60);
    const s = exerciseSeconds % 60;
    elapsedTime.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function getThemeColor(theme) {
    const map = {
      green: "#00ff66",
      red: "#ff3333",
      orange: "#ff9900",
      cyan: "#00ffff",
      rainbow: "#ff3333",
      usa: "#ff3333"
    };
    return map[theme] || "#ff3333";
  }

  function setTheme(theme) {
    clock.className = "";
    clock.classList.add(theme);

    const color = getThemeColor(theme);

    document.body.style.color = color;

    document.querySelectorAll("button, select").forEach(el => {
      el.style.borderColor = color;
      el.style.color = color;
    });
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  setTheme("red");

  updateDisplay();
  updateElapsed();
</script>

</body>
</html>
